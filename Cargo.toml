[workspace]
members = [
    "simple-starter-macro",
    "simple-starter-core",
    "simple-starter-web",
]

resolver = "2"

[workspace.dependencies]
quote = "1.0.43"
syn = { version = "2.0.110", features = ["full", "extra-traits"] }
proc-macro2 = "1.0.105"

anyhow = "1.0.100"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22" , features = ["env-filter", "registry"]}
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"
serde_json = "1.0.148"
inventory = "0.3.21"
tokio = { version = "1.48.0", features = ["full"]}
tokio-cron-scheduler = "0.15.1"
thiserror = "2.0.17"
dashmap = "6.1.0"
async-trait = "0.1.89"
tokio-util = "0.7.18"
tracing-appender = "0.2.4"

axum = "0.8.8"
tower-http = { version = "0.6.8", features = ["trace"] }
